name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        # Extra Python versions run on ubuntu only - there is no OS-specific
        # Python code, so the full cross product would just burn minutes.
        exclude:
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install "ruff==0.17.4" "mypy==2.4.1" ".[test]"
      - run: ruff check src tests benchmarks
      - run: mypy --strict src tests
      - run: pytest tests -q
      - name: Run every example
        shell: bash
        run: for f in examples/*.vx; do python -m vex run "$f" > /dev/null || exit 1; done
      - name: Benchmarks still run
        run: python benchmarks/run.py
