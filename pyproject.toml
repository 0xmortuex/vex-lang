[project]
name = "vex-lang"
version = "0.1.0"
description = "Vex: a friendly, statically typed language with type inference, algebraic data types and exhaustive pattern matching, running on its own bytecode VM."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "0xmortuex" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["programming-language", "interpreter", "type-inference", "bytecode", "vm", "compiler"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Interpreters",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[dependency-groups]
dev = ["pytest>=7", "ruff", "mypy"]

[project.urls]
Homepage = "https://github.com/0xmortuex/vex-lang"

[project.scripts]
vex = "vex.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vex"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
